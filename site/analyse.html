<head>
    <meta charset="utf-8" />

    <title>Smart Expenses — Analyse</title>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#163428",
                        "primary-light": "#2d4b3e",
                        "primary-dim": "#adcebd",
                        "primary-pale": "#c8ead8",
                        "secondary": "#9a452c",
                        "secondary-cont": "#ff9476",
                        "background-dark": "#fdf9f5",
                        "surface": "#f7f3ef",
                        "surface-high": "#ebe7e4",
                        "border-match": "rgba(22, 52, 40, 0.10)"
                    },
                    fontFamily: {
                        "sans": ["Manrope", "sans-serif"],
                        "serif": ["'EB Garamond'", "serif"]
                    },
                    borderRadius: {
                        "sm": "12px",
                        "md": "18px",
                        "lg": "26px",
                        "full": "9999px"
                    }
                }
            }
        }

    <style>
        :root {
  --primary:        #163428;
  --primary-light:  #2d4b3e;
  --primary-dim:    #adcebd;
  --primary-pale:   #c8ead8;
  --secondary:      #9a452c;
  --secondary-cont: #ff9476;
  --bg:             #fdf9f5;
  --surface:        #f7f3ef;
  --surface-high:   #ebe7e4;
  --border:         rgba(22, 52, 40, 0.10);
  --text:           #1c1b1a;
  --text-muted:     #5e6360;
  --text-ghost:     rgba(28, 27, 26, 0.32);
  
  --radius-sm:      12px;
  --radius-md:      18px;
  --radius-lg:      26px;
  --radius-full:    9999px;
  
  --shadow-card:    0 2px 12px rgba(22, 52, 40, 0.06), 0 0 0 1px rgba(22, 52, 40, 0.04);
  --shadow-hover:   0 8px 32px rgba(22, 52, 40, 0.12), 0 0 0 1px rgba(22, 52, 40, 0.06);
}

/* --- Bouton Principal (CTA Plein) --- */
.btn-primary, button.primary, a.cta-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px 24px;
  border-radius: var(--radius-md);
  background: var(--primary);
  color: #ffffff;
  font-family: 'Manrope', sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.02em;
  border: none;
  cursor: pointer;
  text-decoration: none;
  box-shadow: 0 4px 20px rgba(22, 52, 40, 0.25);
  transition: transform 0.2s cubic-bezier(0.34, 1.4, 0.64, 1), box-shadow 0.2s ease, opacity 0.15s;
}
.btn-primary:active, button.primary:active, a.cta-btn:active {
  transform: scale(0.97);
  box-shadow: 0 2px 8px rgba(22, 52, 40, 0.15);
}

/* --- Bouton Secondaire / Outline & Surface --- */
.btn-secondary, button.secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 20px;
  border-radius: var(--radius-md);
  background: var(--surface);
  color: var(--primary);
  font-family: 'Manrope', sans-serif;
  font-size: 14px;
  font-weight: 700;
  border: 1px solid var(--border);
  cursor: pointer;
  text-decoration: none;
  transition: opacity 0.15s ease, background 0.15s ease;
}
.btn-secondary:active, button.secondary:active {
  opacity: 0.75;
}

/* --- Cartes --- */
.card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-card);
  transition: transform 0.25s cubic-bezier(0.34, 1.4, 0.64, 1), box-shadow 0.3s ease;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
}

/* --- Liens d'action --- */
.card-action, .link-action {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: 'Manrope', sans-serif;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--secondary);
  text-decoration: none;
}

body { font-family: 'Manrope', sans-serif !important; background: var(--bg) !important; color: var(--text) !important; }
h1, h2, h3, h4, h5, h6, .card-title, .title { font-family: 'EB Garamond', Georgia, serif !important; letter-spacing: -0.02em; }

        body {
            font-family: 'Manrope', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            width: 100%;
            touch-action: pan-y;
        }
        html { overflow-x: hidden; height: 100%; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Override Tailwind slate colors with matrix green */
        .text-slate-400 { color: var(--muted) !important; }
        .text-slate-500 { color: var(--muted) !important; }
        .text-slate-300 { color: var(--text) !important; }
        .text-white { color: var(--text) !important; }
        .text-slate-100 { color: var(--text) !important; }
        .bg-slate-800 { background: #ffffff !important; }
        .divide-primary\/5 > * + * { border-color: var(--border) !important; }
        /* Nav inactive items */
        a.text-slate-400 { color: var(--muted) !important; }
    </style>
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">\n</head>

<body class="bg-background-dark text-slate-100 min-h-screen flex flex-col">

    <header class="p-4 border-b border-primary/10 sticky top-0 z-10 bg-background-dark/90 backdrop-blur-lg">
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="material-symbols-outlined text-primary">arrow_back</a>
            <div class="size-8 bg-gradient-to-br from-primary to-surface rounded-lg flex items-center justify-center overflow-hidden">
                <img src="assets/piggy_bank_logo.png" alt="Logo" class="size-full object-cover" />
            </div>
            <h1 class="text-xl font-bold">Analyse Détaillée</h1>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto pb-28 p-4 space-y-6">

        <!-- DEPENSES PAR CATEGORIE (Donut) -->
        <section class="bg-primary/5 border border-primary/10 rounded-2xl p-4">
            <h3 class="text-sm font-bold text-primary/70 uppercase tracking-widest mb-4 text-center">Répartition des
                dépenses</h3>
            <div style="position:relative;height:220px;">
                <canvas id="category-donut"></canvas>
            </div>
            <div id="category-legend" class="mt-4 grid grid-cols-2 gap-2 text-[10px]"></div>
        </section>

        <!-- BAR CHART (Evolution Mensuelle) -->
        <section class="bg-primary/5 border border-primary/10 rounded-2xl p-4">
            <h3 class="text-sm font-bold text-primary/70 uppercase tracking-widest mb-4 text-center">Évolution Mensuelle
            </h3>
            <div style="position:relative;height:250px;">
                <canvas id="monthly-bar-chart"></canvas>
            </div>
            <div class="flex justify-center gap-4 mt-4">
                <div class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-primary"></span><span
                        class="text-[10px] text-slate-400">Revenus</span></div>
                <div class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-red-400"></span><span
                        class="text-[10px] text-slate-400">Dépenses</span></div>
                <div class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-blue-400"></span><span
                        class="text-[10px] text-slate-400">Épargne</span></div>
            </div>
        </section>

        <!-- TOP DEPENSES -->
        <section>
            <h3 class="text-base font-bold mb-3">Top Dépenses par Catégorie</h3>
            <div id="category-list" class="space-y-3">
                <div class="p-6 text-center text-slate-500 italic">Chargement...</div>
            </div>
        </section>

    </main>

    <!-- BOTTOM NAV -->
    <nav
        class="fixed bottom-0 left-0 right-0 border-t border-primary/10 bg-background-dark/95 backdrop-blur-lg px-4 pb-6 pt-2 z-10">
        <div class="flex gap-2 max-w-md mx-auto">
            <a href="dashboard.html" class="flex flex-1 flex-col items-center gap-1 py-1 text-slate-400 font-medium">
                <span class="material-symbols-outlined">home</span>
                <p class="text-[10px] uppercase tracking-widest">Accueil</p>
            </a>
            <a href="transactions.html" class="flex flex-1 flex-col items-center gap-1 py-1 text-slate-400 font-medium">
                <span class="material-symbols-outlined">receipt_long</span>
                <p class="text-[10px] uppercase tracking-widest">Portefeuille</p>
            </a>
            <a href="analyse.html" class="flex flex-1 flex-col items-center gap-1 py-1 text-primary font-bold">
                <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">bar_chart</span>
                <p class="text-[10px] uppercase tracking-widest">Stats</p>
            </a>
            <a href="budgets.html" class="flex flex-1 flex-col items-center gap-1 py-1 text-slate-400 font-medium">
                <span class="material-symbols-outlined">account_balance</span>
                <p class="text-[10px] uppercase tracking-widest">Budgets</p>
            </a>
        </div>
    </nav>

    <script>
        const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbwihfIDslI5RPSG8kHLhXyArufZOC1QsLCCkNRTXh5LH93DmixzI6vtjJnioHn_vtncMQ/exec";

        function cleanAmount(v) {
            if (typeof v === 'number') return v;
            if (!v) return 0;
            let s = String(v).replace(/\s/g, '').replace(',', '.').replace(/[^\d.-]/g, '');
            return parseFloat(s) || 0;
        }

        function fmtDH(v) {
            return new Intl.NumberFormat('fr-MA').format(Math.round(v)) + ' DH';
        }

        function getVal(t) {
            const m = cleanAmount(t.montant);
            const i = cleanAmount(t.income);
            return m || i || 0;
        }

        function isRev(t) {
            const incomeVal = String(t.income || "").trim().toLowerCase();
            return incomeVal !== "" && incomeVal !== "false" && incomeVal !== "0";
        }

        function parseDt(s) {
            if (!s) return null;
            if (s instanceof Date) return s;
            let str = String(s).trim();
            if (str.includes('T')) str = str.split('T')[0];
            const parts = str.split(/[/\- ]/);
            if (parts.length >= 3) {
                let y, m, d;
                if (parts[0].length === 4) { // YYYY-MM-DD
                    y = parseInt(parts[0], 10); m = parseInt(parts[1], 10) - 1; d = parseInt(parts[2], 10);
                } else if (parts[2].length === 4) { // DD/MM/YYYY
                    y = parseInt(parts[2], 10); m = parseInt(parts[1], 10) - 1; d = parseInt(parts[0], 10);
                } else {
                    d = parseInt(parts[0], 10); m = parseInt(parts[1], 10) - 1; y = parseInt(parts[2], 10);
                }
                const dt = new Date(y, m, d);
                if (!isNaN(dt.getTime())) return dt;
            }
            if (str.includes('Date(')) {
                const m = str.match(/\d+/g);
                if (m) return new Date(m[0], m[1], m[2]);
            }
            const final = new Date(str);
            return isNaN(final.getTime()) ? null : final;
        }

        async function loadData() {
            try {
                // Show cached first
                const cached = JSON.parse(localStorage.getItem('local_tx_history') || '[]');
                if (cached.length > 0) {
                    renderAnalyse(mergePendingChanges(cached));
                    renderMonthlyChart(mergePendingChanges(cached));
                }

                const res = await fetch(`${SHEETS_API_URL}?action=getAll`);
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('local_tx_history', JSON.stringify(data.data));
                    const merged = mergePendingChanges(data.data);
                    renderAnalyse(merged);
                    renderMonthlyChart(merged);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function mergePendingChanges(baseData) {
            const queue = JSON.parse(localStorage.getItem('pending_tx') || '[]');
            if (queue.length === 0) return baseData;
            let data = [...baseData];
            queue.forEach(item => {
                if (item.action === 'addTransaction') {
                    const exists = data.find(t => String(t.id) === String(item.id));
                    if (!exists) data.unshift(item);
                } else if (item.action === 'updateTransaction') {
                    const idx = data.findIndex(t => String(t.id) === String(item.id));
                    if (idx > -1) data[idx] = { ...data[idx], ...item };
                    else data.unshift(item);
                } else if (item.action === 'deleteTransaction') {
                    data = data.filter(t => String(t.id) !== String(item.id));
                }
            });
            return data;
        }

        function renderAnalyse(tx) {
            const cats = {};
            let totalDep = 0;

            tx.forEach(t => {
                if (isRev(t)) return;
                const c = t.categorie || 'Autre';
                const a = getVal(t);
                cats[c] = (cats[c] || 0) + a;
                totalDep += a;
            });

            const sorted = Object.entries(cats).sort((a, b) => b[1] - a[1]);
            const labels = sorted.map(s => s[0]);
            const val = sorted.map(s => s[1]);

            // Donut Chart
            const ctx = document.getElementById('category-donut');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: val,
                        backgroundColor: [
                            '#a1e633', '#60a5fa', '#f87171', '#fbbf24', '#818cf8', '#f472b6', '#2dd4bf', '#a78bfa'
                        ],
                        borderWidth: 0,
                        hoverOffset: 20
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });

            // Legend
            const legend = document.getElementById('category-legend');
            const colors = ['#e63946', '#ff4d5a', '#b4212c', '#800020', '#ff8fa3', '#c9184a', '#a4161a', '#660708'];
            legend.innerHTML = sorted.slice(0, 8).map((s, i) => `
    <div class="flex items-center gap-1.5 truncate">
      <span class="size-2 rounded-full" style="background:${colors[i % colors.length]}"></span>
      <span class="text-muted text-[9px]">${s[0]}:</span>
      <span class="font-bold text-[9px]">${Math.round(s[1] / (totalDep || 1) * 100)}%</span>
    </div>
  `).join('');

            // List
            const list = document.getElementById('category-list');
            list.innerHTML = sorted.map((s, i) => {
                const pct = Math.round(s[1] / (totalDep || 1) * 100);
                return `
      <div class="bg-primary/5 border border-primary/10 rounded-xl p-4">
        <div class="flex justify-between items-center mb-2">
          <p class="font-bold">${s[0]}</p>
          <p class="font-bold text-primary">${fmtDH(s[1])}</p>
        </div>
        <div class="h-1.5 w-full bg-slate-800 rounded-full overflow-hidden">
          <div class="h-full bg-primary" style="width:${pct}%"></div>
        </div>
        <p class="text-[10px] text-slate-500 mt-1 uppercase tracking-tighter">${pct}% de vos dépenses totales</p>
      </div>
    `;
            }).join('');
        }

        function renderMonthlyChart(tx) {
            const months = {};
            tx.forEach(t => {
                const d = parseDt(t.date);
                if (!d) return;
                const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                if (!months[k]) months[k] = { rev: 0, dep: 0 };
                const a = getVal(t);
                if (isRev(t)) months[k].rev += a;
                else months[k].dep += a;
            });

            const keys = Object.keys(months).sort().slice(-6); // 6 derniers mois
            const labels = keys.map(k => {
                const [y, m] = k.split('-');
                return new Date(y, m - 1).toLocaleDateString('fr-FR', { month: 'short' });
            });
            const revData = keys.map(k => months[k].rev);
            const depData = keys.map(k => months[k].dep);
            const savData = keys.map(k => months[k].rev - months[k].dep);

            const kdhValuesPlugin = {
                id: 'kdhValues',
                afterDatasetsDraw(chart) {
                    const { ctx } = chart;
                    chart.data.datasets.forEach((dataset, i) => {
                        const meta = chart.getDatasetMeta(i);
                        if (!meta.hidden) {
                            meta.data.forEach((element, index) => {
                                const val = dataset.data[index];
                                if (val === 0) return;
                                const text = (Math.abs(val) >= 1000 ? (val / 1000).toFixed(1) + 'k' : val);
                                ctx.font = 'bold 9px Inter';
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'bottom';
                                ctx.fillStyle = '#f5f0f1';
                                if (val >= 0) {
                                    ctx.fillText(text, element.x, element.y - 4);
                                } else {
                                    ctx.textBaseline = 'top';
                                    ctx.fillText(text, element.x, element.y + 4);
                                }
                            });
                        }
                    });
                }
            };

            new Chart(document.getElementById('monthly-bar-chart'), {
                type: 'bar',
                data: {
                    labels,
                    datasets: [
                        { label: 'Revenus', data: revData, backgroundColor: '#e63946', borderRadius: 4 },
                        { label: 'Dépenses', data: depData, backgroundColor: '#b4212c', borderRadius: 4 },
                        { label: 'Épargne', data: savData, backgroundColor: '#ff8fa3', borderRadius: 4 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    layout: { padding: { top: 20 } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#aa8890', font: { size: 10 } } },
                        y: { 
                            display: false,
                            grid: { color: 'rgba(230, 57, 70, 0.05)' }, 
                            ticks: { 
                                color: '#aa8890', 
                                font: { size: 9 }, 
                                callback: v => v >= 1000 ? (v / 1000) + 'k' : v 
                            } 
                        }
                    },
                    plugins: { legend: { display: false } }
                },
                plugins: [kdhValuesPlugin]
            });
        }

        window.onload = loadData;
    </script>
</body>
